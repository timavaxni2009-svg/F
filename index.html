<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Складской учет детской больницы</h1>
            <div class="backup-actions">
                <button id="btnExportJson" class="btn btn-warning">💾 Скачать бэкап (JSON)</button>
                <label for="importJson" class="btn btn-warning" style="cursor: pointer;">📂 Загрузить бэкап (JSON)</label>
                <input type="file" id="importJson" accept=".json" style="display: none;">
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="tab-accounting">📋 Учет</button>
            <button class="tab-btn" data-tab="tab-receipts">📦 Приход на склад</button>
            <button class="tab-btn" data-tab="tab-reports">📊 Отчеты</button>
        </nav>

        <section id="tab-accounting" class="tab-content active">
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="Поиск по названию, кабинету, серийному номеру...">
                <button id="btnAddMainRow" class="btn btn-primary">➕ Добавить строку</button>
                <button id="btnExportExcel" class="btn btn-success">📥 Экспорт в Excel</button>
            </div>
            
            <div class="table-wrapper">
                <table id="mainTable">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Что?</th>
                            <th>Где? (Куда?)</th>
                            <th>Когда взяли</th>
                            <th>Когда внедрили</th>
                            <th>Инвентарный номер</th>
                            <th>Номер накладной</th>
                            <th>Серийный номер</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="mainTableBody">
                    </tbody>
                </table>
            </div>
        </section>

        <section id="tab-receipts" class="tab-content">
            <h2>Оформление прихода на склад</h2>
            <form id="receiptForm">
                <div class="form-row">
                    <label>Дата прихода:</label>
                    <input type="date" id="receiptDate" required>
                    
                    <label>Поставщик:</label>
                    <input type="text" id="receiptSupplier" placeholder="ООО 'МКТрейд'" required>
                </div>
                
                <h3>Список предметов</h3>
                <div id="receiptItems">
                </div>
                <button type="button" id="btnAddReceiptItem" class="btn btn-secondary">➕ Добавить предмет в накладную</button>
                
                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">💾 Сохранить приход</button>
                </div>
            </form>
        </section>

        <section id="tab-reports" class="tab-content">
            <h2>Генерация отчетов</h2>
            <div class="toolbar">
                <label>Период:</label>
                <select id="reportPeriod">
                    <option value="month">За месяц</option>
                    <option value="halfyear">За полгода</option>
                    <option value="year">За год</option>
                </select>
                
                <label>Начало периода:</label>
                <input type="date" id="reportStartDate">
                
                <button id="btnGenerateReport" class="btn btn-primary">Сформировать</button>
                <button id="btnExportReport" class="btn btn-success">📥 Экспорт отчета в Excel</button>
            </div>
            
            <div id="reportOutput" class="report-box">
                <p>Выберите период и нажмите "Сформировать".</p>
            </div>
        </section>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Добавить запись</h2>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Что? (Название):</label>
                    <input type="text" id="editItemName" required>
                </div>
                <div class="form-group">
                    <label>Где? (Куда?):</label>
                    <input type="text" id="editLocation" required>
                </div>
                <div class="form-group">
                    <label>Когда взяли:</label>
                    <input type="date" id="editDateTaken">
                </div>
                <div class="form-group">
                    <label>Когда внедрили:</label>
                    <input type="date" id="editDateImplemented">
                </div>
                <div class="form-group">
                    <label>Инвентарный номер:</label>
                    <input type="text" id="editInvNumber">
                </div>
                <div class="form-group">
                    <label>Количество:</label>
                    <input type="number" id="editQuantity" required min="1">
                </div>
                <div class="form-group">
                    <label>Номер накладной:</label>
                    <input type="text" id="editInvoiceNumber">
                </div>
                <div class="form-group">
                    <label>Серийный номер:</label>
                    <input type="text" id="editSerialNumber">
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
